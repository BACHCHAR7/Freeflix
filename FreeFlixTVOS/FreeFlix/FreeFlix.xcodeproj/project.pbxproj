		3456EAFF2EF7300000276D08 /* Fix Framework Bundle IDs */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Fix Framework Bundle IDs";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "echo \"=== Fix Framework Bundle IDs Script ===\"\nFRAMEWORKS_PATH=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\necho \"Frameworks path: $FRAMEWORKS_PATH\"\necho \"Code sign identity: ${EXPANDED_CODE_SIGN_IDENTITY}\"\nif [ -d \"$FRAMEWORKS_PATH\" ]; then\n    find \"$FRAMEWORKS_PATH\" -type d -name \"*.framework\" | while read framework; do\n        plist=\"$framework/Info.plist\"\n        if [ -f \"$plist\" ]; then\n            CURRENT_ID=$(/usr/libexec/PlistBuddy -c \"Print :CFBundleIdentifier\" \"$plist\" 2>/dev/null || echo \"\")\n            echo \"Checking: $framework -> $CURRENT_ID\"\n            if echo \"$CURRENT_ID\" | grep -q \"_\"; then\n                FIXED_ID=$(echo \"$CURRENT_ID\" | tr '_' '-')\n                echo \"Fixing: $CURRENT_ID -> $FIXED_ID\"\n                /usr/libexec/PlistBuddy -c \"Set :CFBundleIdentifier $FIXED_ID\" \"$plist\"\n                codesign --remove-signature \"$framework\" 2>/dev/null || true\n                codesign --force --deep --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --identifier \"$FIXED_ID\" --generate-entitlement-der \"$framework\"\n                echo \"Re-signed: $framework\"\n                codesign -dv \"$framework\" 2>&1 | head -5\n            fi\n        fi\n    done\nelse\n    echo \"Frameworks directory not found\"\nfi\necho \"=== Script Complete ===\"\n";
		};
/* End PBXShellScriptBuildPhase section */

